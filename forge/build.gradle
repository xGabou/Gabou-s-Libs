plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "gaboulibs.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}
sourceSets {
    main {
        resources.srcDir project(':common').file('src/main/resources')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = group          // your group
            artifactId = 'gaboulibs_forge'       // your library name
            version = project.version              // update per release
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/xGabou/Gabou-s-Libs")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "N8aGZtvj" // from your Modrinth project URL
    versionNumber = "Forge-${project.version}"
    versionName = "Gabou's Libs${mod_version}"
    changelog = rootProject.file("gabous.md").text
    gameVersions = ["1.20.1"]
    loaders = ["forge"]
    versionType = "release"
    dependencies {
        required.project "lhGA9TYQ"
    }
    uploadFile = file("build/libs/${archivesBaseName}-${version}.jar")
}

    curseforge {
        apiKey = System.getenv("CURSEFORGE_TOKEN")

        project {
            id = "1367332"
            changelogType = "markdown"
            changelog = rootProject.file("gabous.md").text
            releaseType = "release" // options: alpha, beta, release
            addGameVersion "1.20.1"
            addGameVersion "Forge"
            mainArtifact(file("build/libs/${archivesBaseName}-${version}.jar")) {
                displayName = "Forge-${version}"
            }
        }
    }
