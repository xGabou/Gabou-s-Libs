plugins {
    id 'com.gradleup.shadow'
    id 'com.matthewprenger.cursegradle' version '1.4.0' // CurseForge uploader
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
}

loom {
    forge {
        mixinConfig "gaboulibs.mixins.json"
    }
}
sourceSets {
    main {
        resources.srcDir project(':common').file('src/main/resources')
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    compileOnly "curse.maven:serene-seasons-291874:5206531"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

def shadowJarTask = tasks.named('shadowJar')
def remapJarTask = tasks.named('remapJar')

shadowJarTask.configure {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set('dev-shadow')
}

remapJarTask.configure {
    inputFile.set(shadowJarTask.flatMap { it.archiveFile })
}
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "N8aGZtvj" // from your Modrinth project URL
    versionNumber = "Forge-${project.version}"
    versionName = "Gabou's Libs ${mod_version}"
    changelog = rootProject.file("GabousLibs.md").text
    gameVersions = ["1.20.4"]
    loaders = ["forge"]
    versionType = "release"
    uploadFile = file("build/libs/${archivesBaseName}-${version}.jar")
}
curseforge {
    apiKey = System.getenv("CURSEFORGE_TOKEN")

    project {
        id = "1367332"
        changelog = rootProject.file("GabousLibs.md")
        releaseType = "release" // options: alpha, beta, release
        addGameVersion "1.20.4"
        addGameVersion "Forge"
        mainArtifact(file("build/libs/${archivesBaseName}-${version}.jar")) {
            displayName = "Forge-${version}"
        }
    }
}
