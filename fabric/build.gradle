import io.github.themrmilchmann.gradle.publish.curseforge.ChangelogFormat
import io.github.themrmilchmann.gradle.publish.curseforge.ReleaseType

plugins {
    id 'com.gradleup.shadow'
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
}

apply plugin: "io.github.themrmilchmann.curseforge-publish"

architectury {
    platformSetupLoomIde()
    fabric()
}
sourceSets {
    main {
        resources.srcDir project(':common').file('src/main/resources')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def replayCompat = providers.gradleProperty("replayCompat").orElse("none").get()
if (!(replayCompat in ["none", "flashback", "replaymod"])) {
    throw new GradleException("Unsupported replayCompat value '${replayCompat}'. Use none, flashback, or replaymod.")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    if (replayCompat == "flashback") {
        modLocalRuntime "maven.modrinth:flashback:3GzWAKj5"
    } else if (replayCompat == "replaymod") {
        modLocalRuntime "maven.modrinth:replaymod:LcmLujKZ"
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    archiveClassifier.set('')
}
build.dependsOn shadowJar
shadowJar.finalizedBy(remapJar)


def remappedJar = tasks.remapJar.archiveFile

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "N8aGZtvj"
    versionNumber = "Fabric-${project.version}"
    versionName = "Serene Seasons Plus ${mod_version}"
    changelog = rootProject.file("GabousLibs.md").text
    gameVersions = ["1.21.11"]
    loaders = ["fabric"]
    versionType = "release"
    uploadFile = remappedJar
}

curseforge {
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    publications {
        register("curseForge") {
            projectId = "1367332"

            gameVersion rootProject.curseforge_minecraft_version_type, rootProject.curseforge_minecraft_version
            gameVersion "modloader", "fabric"
            gameVersion "environment", "client"
            gameVersion "environment", "server"

            artifacts.register("main") {
                displayName = "Fabric-${project.version}"
                releaseType = ReleaseType.RELEASE

                changelog {
                    format = ChangelogFormat.MARKDOWN
                    from(rootProject.file("GabousLibs.md"))
                }

                from(tasks.named("remapJar"))
            }
        }
    }
}


