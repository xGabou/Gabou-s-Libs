import io.github.themrmilchmann.gradle.publish.curseforge.ChangelogFormat
import io.github.themrmilchmann.gradle.publish.curseforge.ReleaseType

plugins {
    id 'com.gradleup.shadow'
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
}

apply plugin: "io.github.themrmilchmann.curseforge-publish"

architectury {
    platformSetupLoomIde()
    neoForge()
}
sourceSets {
    main {
        resources.srcDir project(':common').file('src/main/resources')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}
repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "N8aGZtvj" // from your Modrinth project URL
    versionNumber = "NeoForge-${project.version}"
    versionName = "Gabou's Libs ${mod_version}"
    changelog = rootProject.file("GabousLibs.md").text
    gameVersions = ["1.21.11"]
    loaders = ["neoforge"]
    versionType = "release"
    uploadFile = tasks.named("remapJar").flatMap { it.archiveFile }
}
curseforge {
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    publications {
        register("curseForge") {
            projectId = "1367332"

            gameVersion rootProject.curseforge_minecraft_version_type, rootProject.curseforge_minecraft_version
            gameVersion "modloader", "neoforge"
            gameVersion "environment", "client"
            gameVersion "environment", "server"

            artifacts.register("main") {
                displayName = "NeoForge-${project.version}"
                releaseType = ReleaseType.RELEASE

                changelog {
                    format = ChangelogFormat.MARKDOWN
                    from(rootProject.file("GabousLibs.md"))
                }

                from(tasks.named("remapJar"))
            }
        }
    }
}

