plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
    id 'com.matthewprenger.cursegradle' version '1.4.0' // CurseForge uploader
}

architectury {
    minecraft = project.minecraft_version
}



allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'com.modrinth.minotaur'
    apply plugin: 'com.matthewprenger.cursegradle'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url "https://maven.blamejared.com/" }
        maven {
            url "https://www.cursemaven.com"
            content { includeGroup "curse.maven" }
        }
        maven {
            name = 'GeckoLib'
            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroupByRegex('software\\.bernie.*')
                includeGroup("com.eliotlash.mclib")
            }
        }
        maven { url = "https://api.modrinth.com/maven" }
        maven {
            name "nonamecrackers2Maven"
            url "https://maven.nonamecrackers2.dev/releases"
        }
        maven { url "https://maven.theillusivec4.top/" }
        flatDir { dir 'libs' }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    // Configure Maven publishing.


}
import groovy.json.JsonOutput

tasks.register("discordWebhook") {
    doLast {
        def webhookUrl = System.getenv("DISCORD_WEBHOOK_URL")?.trim()
        if (!webhookUrl) {
            println "Skipping Discord webhook notification: DISCORD_WEBHOOK_URL not set."
            return
        }

        def changelogText = rootProject.file("gabous.md").text

        def payload = [
                username        : "Build Bot",
                allowed_mentions: [parse: ["roles"]],
                content         : "**New release published!** 🎉\n" +
                        "Project: ${mod_name}\n" +
                        "Version: v${project.mod_version}-1.20.1\n\n" +
                        "${changelogText.take(1891)}"
        ]

        println "Sending release notification to Discord..."
        def connection = new URL(webhookUrl).openConnection()
        connection.with {
            doOutput = true
            requestMethod = "POST"
            setRequestProperty("Content-Type", "application/json")
            outputStream.withWriter("UTF-8") { it << JsonOutput.toJson(payload) }
            println "Webhook sent with response code: ${responseCode}"
        }
    }
}

