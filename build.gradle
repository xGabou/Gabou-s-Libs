plugins {
    id "dev.architectury.loom-no-remap" version "1.17-SNAPSHOT" apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.0.1' apply false
    id "io.github.themrmilchmann.curseforge-publish" version "0.9.0" apply false
    id "com.modrinth.minotaur" version "2.8.10" apply false // Modrinth uploader

}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }
    repositories {
        // Architectury API and its platform implementations are published here.
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
        }
        maven {
            name = "CurseMaven"
            url = "https://cursemaven.com"
        }
        maven {
            url = "https://api.modrinth.com/maven"
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.architectury.minecraft}"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }


    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Local development publishing targets
            mavenLocal()
            maven {
                name = "localBuildRepo"
                url = uri("${rootProject.buildDir}/maven-repo")
            }
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

// Convenience task to publish all platform jars to mavenLocal
tasks.register('publishAllToMavenLocal') {
    group = 'publishing'
    description = 'Publishes common, fabric and neoforge modules to mavenLocal.'
    dependsOn ':common:publishToMavenLocal', ':fabric:publishToMavenLocal', ':neoforge:publishToMavenLocal'
}
